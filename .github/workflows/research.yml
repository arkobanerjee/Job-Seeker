name: Private job research
on:
  schedule:
    - cron: '17 9 * * 1-5'
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      mode:
        description: Discovery or saved-source monitoring
        required: false
        default: discovery
        type: choice
        options: [discovery, monitor, notifications, backup, restore, diagnostics, maintenance]
      backup_id:
        description: Retained backup ID for explicit research restore
        required: false
        type: string
      run_id:
        description: 'Optional saved run ID to resume'
        required: false
        type: string
# Scheduled runs also require monitoring.schedule_enabled in private cloud settings.
permissions:
  contents: read
concurrency:
  group: job-seeker-private-state
  cancel-in-progress: false
jobs:
  research:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.lock
      - name: Research and checkpoint to private R2
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_SEEKER_URL: ${{ secrets.JOB_SEEKER_URL }}
          JOB_SEEKER_APP_TOKEN: ${{ secrets.JOB_SEEKER_APP_TOKEN }}
          RESEARCH_EVENT: ${{ github.event_name }}
          BACKUP_ID: ${{ inputs.backup_id }}
          RESEARCH_MODE: ${{ inputs.mode }}
          RESUME_RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          if [ "$RESEARCH_EVENT" = "schedule" ]; then
            python -m job_seeker.cloud notifications
            python -m job_seeker.cloud maintenance
            python -m job_seeker.cloud scheduled
          elif [ -n "$RESUME_RUN_ID" ]; then
            python -m job_seeker.cloud run --run-id "$RESUME_RUN_ID"
          elif [ "$RESEARCH_MODE" = "maintenance" ]; then
            python -m job_seeker.cloud maintenance
          elif [ "$RESEARCH_MODE" = "diagnostics" ]; then
            python -m job_seeker.cloud diagnostics
          elif [ "$RESEARCH_MODE" = "backup" ]; then
            python -m job_seeker.cloud backup
          elif [ "$RESEARCH_MODE" = "restore" ]; then
            python -m job_seeker.cloud restore --backup-id "$BACKUP_ID"
          elif [ "$RESEARCH_MODE" = "notifications" ]; then
            python -m job_seeker.cloud notifications
          elif [ "$RESEARCH_MODE" = "monitor" ]; then
            python -m job_seeker.cloud monitor
          else
            python -m job_seeker.cloud run
          fi
      # Never upload private profile/resume/results as public-repository artifacts.
