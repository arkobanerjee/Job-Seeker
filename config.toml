# Public defaults. Credentials belong in .env; personal text belongs in private/.
[model]
provider = "openai"
name = "gpt-5.6-luna"
reasoning_effort = "low"
max_output_tokens = 4000
# Verified standard, uncached USD per million tokens, 2026-10-23.
input_usd_per_million = 0.20
output_usd_per_million = 1.20

[limits]
run_usd = 2.0
max_searches = 6
max_pages = 12
max_model_calls = 16
context_bytes = 60000

[prompts]
master_file = "prompts/master.md"
profile_file = "private/profile.md"
resume_file = "private/resume.md"
# Optional extra instructions appended to the editable master prompt.
instructions = "Prioritize Germany. Keep technically relevant roles with language conflicts for manual review."

[search]
queries = [
  { track = "ai", query = "AI Engineer LLM RAG Germany (site:jobs.lever.co OR site:job-boards.greenhouse.io OR site:recruitee.com)" },
  { track = "data", query = "Data Scientist Analyst Germany English (site:jobs.personio.de OR site:jobs.lever.co OR site:job-boards.greenhouse.io)" },
  { track = "ai", query = "Applied AI engineer Germany careers RAG site:jobs.personio.de" },
  { track = "data", query = "Analytics engineer data analyst Germany English site:jobs.lever.co" },
  { track = "ai", query = "AI engineer RAG Europe UAE remote careers English" },
  { track = "data", query = "Data scientist analyst Croatia Cyprus Armenia UAE remote English careers" },
]

[notifications]
telegram = false

[monitoring]
schedule_enabled = false
daily_run_usd = 0.25
# True revisits saved sources instead of issuing web searches.
enabled = false
max_sources = 12
# Bounded ATS counts, independent of paid research. Still requires schedule_enabled.
board_observations = true
max_boards = 4
# Optional public Greenhouse/Lever board URLs; known ATS posting URLs also seed boards.
board_urls = []

# Daily workflow runs at 09:17 Europe/Berlin, subject to these settings.
# Enable explicitly in the private cloud config after deployment acceptance.

[signals]
# Reserves part of the existing search allowance; never adds to it.
enabled = false
max_queries = 2
queries = [
  { track = "ai", route = "technology", query = 'Germany company engineering blog RAG LLM production platform' },
  { track = "data", route = "hiring", query = 'Germany company "data team" "hiring" English' },
  { track = "ai", route = "company", query = 'Germany applied AI companies RAG products careers' },
  { track = "ai", route = "product", query = 'Germany company launches AI product engineering team' },
  { track = "data", route = "organization", query = 'Germany company expansion data engineering team announcement' },
]

[review]
# Separate model context; shares the run spending and model-call limits.
enabled = false
max_jobs = 3

[competitors]
# Reserve one of the existing query slots for evidence-backed expansion.
enabled = false
max_queries = 1

[companies]
# User-approved identity rules. Example:
# profiles = [{ name = "Example", aliases = ["Example GmbH"], official_domains = ["example.com"] }]
profiles = []

[corroboration]
# Compares already collected sources; no extra searches.
enabled = false
max_pairs = 2
# Only add ownership groups you have verified; different hosts alone are insufficient.
publishers = {}
